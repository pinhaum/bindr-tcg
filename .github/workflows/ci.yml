# Roda linter, análise de segurança e suíte de testes em cada push e pull
# request. O serviço Postgres existe porque a suíte não é isolável do banco:
# `test/lib/stack_test.rb` prova que a stack de AD-002 está ativa, e a Fase 2
# inteira depende de extensões que só o PostgreSQL tem.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Rubocop
        run: bin/rubocop

      # --ensure-ignore-notes exige justificativa em cada entrada de
      # config/brakeman.ignore; --ensure-no-obsolete-ignore-entries derruba o
      # build quando um ignore deixa de corresponder a um aviso real. Juntas,
      # impedem que o arquivo de ignore vire um depósito silencioso.
      - name: Brakeman
        run: bin/brakeman --no-pager --ensure-ignore-notes --ensure-no-obsolete-ignore-entries

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bindr
          POSTGRES_PASSWORD: bindr
          POSTGRES_DB: bindr_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bindr"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: bindr
      POSTGRES_PASSWORD: bindr
      POSTGRES_DB: bindr_development
      # Variável própria, não derivada de POSTGRES_DB: o terceiro teste de
      # stack_test.rb existe para matar a regressão de os dois bancos
      # coincidirem. Defini-la aqui mantém o CI fiel ao ambiente local.
      POSTGRES_TEST_DB: bindr_test

    steps:
      - uses: actions/checkout@v4

      # O projeto usa `schema_format = :sql`, então `db:prepare` carrega
      # `db/structure.sql` via `psql` e regenera o dump com `pg_dump`. O
      # `pg_dump` recusa servidor de major mais nova que a sua — medido: o
      # cliente 15 aborta contra o servidor 17 com "server version mismatch".
      # A imagem do runner não garante cliente algum, então fixamos a 17 pelo
      # PGDG, o mesmo motivo e a mesma major do `Dockerfile.dev`.
      - name: Instalar o cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          # O runner já traz um postgresql-client-16, e o pacote novo só
          # reassume o `psql` via update-alternatives — `/usr/bin/pg_dump`
          # continua sendo o 16. Como é o `pg_dump` que recusa servidor de
          # major mais nova, é ele que precisa vir do 17: o diretório da
          # major entra na frente do PATH para os steps seguintes.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Conferir a major do cliente PostgreSQL
        run: |
          psql --version
          pg_dump --version
          # Falha o job se `pg_dump` não for 17: sem isso, a divergência volta
          # silenciosamente e só aparece quando `db:prepare` regenerar o dump.
          pg_dump --version | grep -q ' 17\.' || {
            echo "pg_dump não é da major 17: $(pg_dump --version)" >&2
            exit 1
          }

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Preparar o banco de teste
        run: bin/rails db:prepare

      - name: Testes
        run: bin/rails test
