services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bindr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bindr}
      POSTGRES_DB: ${POSTGRES_DB:-bindr_development}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bindr}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # `db:prepare` é idempotente: cria o banco na primeira subida e só aplica
    # migrações pendentes nas seguintes. É o que torna `docker compose up` o
    # comando único do Req. 11.6.
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bindr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bindr}
      POSTGRES_DB: ${POSTGRES_DB:-bindr_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-bindr_test}
      APITCG_API_KEY: ${APITCG_API_KEY:-}
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  frontend:
    image: node:24.21.0-slim
    working_dir: /frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app
    # `npm ci` + Vite demoram; o e2e espera o dev server responder em /app/.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/app/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 5s

  # Só sobe com `--profile e2e`: `docker compose up` continua sem ele (Req. 11.6).
  # A versão da imagem acompanha a do @playwright/test no package-lock.json.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /frontend
    command: npx playwright test
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
  frontend_node_modules:
